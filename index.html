<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flight Deck">
  <meta name="theme-color" content="#0a0c10">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Flight Deck</title>
  <link rel="stylesheet" href="./style.css?v=120">
</head>
<body>
  <div id="app">
    <!-- Top Global Header -->
    <header class="top-bar">
      <!-- Left: Signal Icon -->
      <div id="sim-status" class="wifi-badge disconnected" aria-label="Connection Status">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>

      <!-- Center: Garmin Menu Button -->
      <button id="menu-toggle-btn" class="garmin-menu-btn" aria-label="Open Navigation Menu">
        <svg width="24" height="20" viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <line x1="2" y1="3" x2="22" y2="3"></line>
          <line x1="2" y1="10" x2="22" y2="10"></line>
          <line x1="2" y1="17" x2="22" y2="17"></line>
        </svg>
      </button>

      <!-- Right: Active Profile Badge (Max 7 Chars) -->
      <div class="aircraft-badge" id="aircraft-model">DEFAULT</div>

      <!-- Dropdown Menu Drawer -->
      <div id="menu-dropdown" class="menu-dropdown">
        <button class="menu-item-btn active" data-page="radios">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"></path>
            <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"></path>
            <circle cx="12" cy="12" r="2"></circle>
            <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"></path>
            <path d="M19.1 4.9C23 8.8 23 15.2 19.1 19.1"></path>
          </svg>
          Radios
        </button>

        <button class="menu-item-btn" data-page="autopilot">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path>
          </svg>
          Autopilot
        </button>

        <button class="menu-item-btn" data-page="lights">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
          </svg>
          Lights
        </button>

        <button class="menu-item-btn" data-page="settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          Settings
        </button>

        <!-- Install PWA Button -->
        <button id="pwa-install-btn" class="menu-item-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Install App
        </button>

        <div class="menu-divider"></div>

        <!-- Theme Toggle Row -->
        <div class="theme-toggle-row">
          <div class="theme-label-group">
            <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span id="theme-label-text">Dark Theme</span>
          </div>
          <label class="switch" aria-label="Toggle Theme">
            <input type="checkbox" id="theme-toggle-checkbox">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </header>

    <!-- Header Bezel Separator -->
    <div class="header-separator-wrap">
      <div class="header-separator"></div>
    </div>

    <!-- Main View Content Area -->
    <main id="content-area">
      <!-- Active page view renders here -->
    </main>

    <!-- Preset Modal -->
    <div id="preset-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <h3 id="modal-title">Configure Preset</h3>
        
        <div class="modal-field">
          <label for="modal-label-input">Label (e.g. TWR, ATIS, ILS)</label>
          <input type="text" id="modal-label-input" maxlength="5" placeholder="TWR" autocomplete="off" />
        </div>

        <div class="modal-field">
          <label for="modal-freq-input">Frequency (MHz)</label>
          <input type="text" inputmode="decimal" id="modal-freq-input" placeholder="121.500" autocomplete="off" />
        </div>

        <div class="modal-actions">
          <button id="modal-cancel-btn" class="btn-secondary">Cancel</button>
          <button id="modal-done-btn" class="btn-primary">Save Preset</button>
        </div>
      </div>
    </div>

    <!-- iOS Add-to-Home Screen Modal -->
    <div id="ios-install-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <h3 style="color: var(--accent-cyan);">Install Flight Deck</h3>
        <p style="font-size: 13px; color: var(--menu-text); line-height: 1.5;">
          To install this app on your iPhone / iPad:
        </p>
        <ol style="font-size: 13px; color: var(--menu-text); padding-left: 20px; line-height: 1.6;">
          <li>Tap the <strong>Share</strong> button ( <span style="font-size: 16px;">⎋</span> ) in Safari.</li>
          <li>Scroll down and tap <strong>Add to Home Screen</strong>.</li>
        </ol>
        <div class="modal-actions" style="margin-top: 10px;">
          <button id="ios-install-done-btn" class="btn-primary">Got It</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js?v=150"></script>

  <!-- Active Profile Badge Sync (Truncated to first 7 characters) -->
  <script>
    (function initProfileBadgeSync() {
      function hookSocket() {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${proto}//${location.host}`);

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'PROFILE_STATE' && data.profile_name) {
              const badge = document.getElementById('aircraft-model');
              if (badge) {
                // Truncate to maximum of 7 characters
                badge.innerText = data.profile_name.trim().slice(0, 7).toUpperCase();
              }
            }
          } catch (e) {}
        };

        ws.onclose = () => {
          setTimeout(hookSocket, 3000);
        };
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', hookSocket);
      } else {
        hookSocket();
      }
    })();
  </script>
</body>
</html>
