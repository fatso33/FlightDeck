<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#121820">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FlightDeck</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Top Navigation Bar -->
        <header class="app-header">
            <button id="menu-btn" class="icon-btn menu-btn" aria-label="Toggle Menu">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div class="app-title">FlightDeck</div>
            <div class="header-status">
                <span id="connection-status" class="status-indicator disconnected"></span>
                <span id="status-text" class="status-text">Disconnected</span>
            </div>
        </header>

        <!-- Slide-out Drawer / Menu -->
        <div id="menu-overlay" class="menu-overlay"></div>
        <aside id="nav-drawer" class="nav-drawer">
            <div class="drawer-header">
                <div class="drawer-title">Navigation</div>
            </div>

            <div class="drawer-section">
                <label for="profile-select" class="section-label">AIRCRAFT PROFILE</label>
                <select id="profile-select" class="profile-dropdown">
                    <option value="default">Default Profile</option>
                </select>
            </div>

            <nav class="drawer-nav">
                <button class="nav-item active" data-page="radios">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"></path>
                        <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"></path>
                        <circle cx="12" cy="12" r="2"></circle>
                        <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"></path>
                        <path d="M19.1 4.9C23 8.8 23 15.2 19.1 19.1"></path>
                    </svg>
                    <span>Radios & Avionics</span>
                </button>
                <button class="nav-item" data-page="autopilot">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="12" x2="16" y2="14"></line>
                    </svg>
                    <span>Autopilot (AP)</span>
                </button>
            </nav>
        </aside>

        <!-- Dynamic Main Content Viewport -->
        <main id="page-container" class="page-container"></main>
    </div>

    <!-- Page Scripts -->
    <script src="pages/radios.js"></script>
    <script src="pages/autopilot.js"></script>
    <script src="app.js"></script>
</body>
</html>
